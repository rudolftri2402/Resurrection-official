<div class="codex-modal" id="characterModal"
     role="dialog" aria-modal="true"
     aria-labelledby="modalName" hidden>

    <div class="codex-modal-panel">
        <button class="modal-close" id="closeModal"
                aria-label="Close profile">×</button>

        <div class="modal-art">
            <img id="modalImage" src="" alt="">

        <div class="modal-content">
            <p class="codex-eyebrow" id="modalNumber">CHARACTER PROFILE</p>
            <h2 id="modalName">Sera</h2>
            <p class="modal-subtitle" id="modalSubtitle"></p>

            <p class="modal-label">STORY</p>

            <div class="modal-meta">
                <span>RACE</span>
                <strong id="modalRace"></strong>

            </div>

            <div class="modal-navigation">
                <button id="modalPrevious">← Previous</button>
                <button id="modalNext">Next →</button>
            </div>
        </div>

};

const cards = [...document.querySelectorAll(".codex-card")];
const filters = [...document.querySelectorAll(".race-filter")];
const search = document.getElementById("characterSearch");
const modal = document.getElementById("characterModal");
let activeId = "sera corrupted";
let lastFocused = null;

function filterCharacters() {
    const race = document.querySelector(".race-filter.selected").dataset.race;
    const query = search.value.trim().toLowerCase();
    let visible = 0;

    cards.forEach(card => {
        const matchesRace = race === "all" ||
            card.dataset.race === race;
        const matchesName = card.dataset.name.toLowerCase().includes(query);
        const show = matchesRace && matchesName;

        card.hidden = !show;
        if (show) visible++;
    });

    document.getElementById("characterCount").textContent =
        `${visible} CHARACTER${visible === 1 ? "" : "S"}`;
    document.getElementById("noCharacters").hidden = visible !== 0;
}

filters.forEach(button => {
    button.addEventListener("click", () => {
        filters.forEach(item => item.classList.remove("selected"));
        button.classList.add("selected");
        filterCharacters();
    });
});

search.addEventListener("input", filterCharacters);

function openProfile(id) {
    const character = characterData[id];
    if (!character) return;

    activeId = id;
    lastFocused = document.activeElement;

    document.getElementById("modalImage").src = character.image;
    document.getElementById("modalImage").alt = character.name;
    document.getElementById("modalNumber").textContent = character.number;
    document.getElementById("modalName").textContent = character.name;
    document.getElementById("modalSubtitle").textContent = character.subtitle;
    document.getElementById("modalStory").textContent = character.story;
    document.getElementById("modalRace").textContent = character.race;
    document.getElementById("modalElement").textContent = character.element;

    modal.hidden = false;
    document.body.classList.add("modal-open");
    document.getElementById("closeModal").focus();
}

function closeProfile() {
    modal.hidden = true;
    document.body.classList.remove("modal-open");
    if (lastFocused) lastFocused.focus();
}

cards.forEach(card => {
    card.addEventListener("click", () => openProfile(card.dataset.id));
});

document.getElementById("closeModal").addEventListener("click", closeProfile);

modal.addEventListener("click", event => {
    if (event.target === modal) closeProfile();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !modal.hidden) closeProfile();
});

function navigateProfile(direction) {
    const ids = Object.keys(characterData);
    const index = ids.indexOf(activeId);
    const nextIndex = (index + direction + ids.length) % ids.length;
    openProfile(ids[nextIndex]);
}

document.getElementById("modalPrevious").addEventListener("click",
    () => navigateProfile(-1));
document.getElementById("modalNext").addEventListener("click",
    () => navigateProfile(1));
</script>
